name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    if: github.actor == 'SalahaldinBilal'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: "v1-rust-windows-latest"
          cache-on-failure: true

      - name: Resolve version
        id: version
        run: |
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (cargo metadata --no-deps --format-version 1 --manifest-path src-tauri\Cargo.toml | ConvertFrom-Json).packages[0].version
          if ($package -ne $tauri -or $package -ne $cargo) {
            throw "Versions disagree: package.json $package, tauri.conf.json $tauri, Cargo.toml $cargo"
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$package") {
            throw "Tag ${{ github.ref_name }} does not match version $package"
          }
          "number=$package" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: cargo test --locked --manifest-path src-tauri\Cargo.toml

      - name: Build installer
        run: npm run tauri build

      - name: Collect installer
        run: |
          $built = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $built) { throw "Tauri did not produce an NSIS installer" }
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item $built.FullName "dist-release\SimpleMicLock-Setup-${{ steps.version.outputs.number }}.exe"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = (Get-ChildItem "dist-release\*.exe").FullName
          gh release create "${{ github.ref_name }}" $installer `
            --title "Simple Mic Lock ${{ github.ref_name }}" `
            --generate-notes

      - name: Upload installer for testing
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist-release/*.exe
          retention-days: 7
