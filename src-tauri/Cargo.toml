[package]
name = "simple-mic-lock"
version = "0.2.0"
description = "Keeps your microphone volume where you set it"
authors = ["SalahaldinBilal"]
edition = "2024"

[lib]
name = "simple_mic_lock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
resvg = { version = "0.48.1", default-features = false }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon", "devtools", "unstable"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]
